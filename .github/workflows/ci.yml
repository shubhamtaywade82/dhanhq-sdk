name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 18 is the floor declared in `engines`; 22 is current LTS.
        node-version: ["18", "20", "22"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # `--ignore-scripts` skips the `prepare` build so the build step below is
      # the one that reports failures.
      - run: npm ci --ignore-scripts

      - run: npm run typecheck

      - run: npm run lint

      - run: npm run format:check

      - run: npm test -- --runInBand --coverage

      - run: npm run build

  package:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci --ignore-scripts
      - run: npm run build

      # Catches broken `exports` maps and declaration resolution before a
      # release rather than after.
      - name: Check published type resolution
        run: npx --yes @arethetypeswrong/cli@latest --pack .

      - name: Verify the tarball installs and imports
        run: |
          npm pack --pack-destination /tmp
          mkdir -p /tmp/consumer && cd /tmp/consumer
          echo '{"name":"consumer","version":"1.0.0"}' > package.json
          npm install /tmp/*.tgz
          node -e "const s=require('@nemesis-oss/dhanhq-sdk'); if (typeof s.DhanClient!=='function') throw new Error('CJS entry broken')"
          node --input-type=module -e "import {DhanClient} from '@nemesis-oss/dhanhq-sdk'; if (typeof DhanClient!=='function') throw new Error('ESM entry broken')"
          node -e "const b=require('@nemesis-oss/dhanhq-sdk/browser'); if (typeof b.Pipeline!=='function') throw new Error('browser CJS entry broken'); if (typeof b.DhanClient!=='undefined') throw new Error('browser entry leaks DhanClient')"
          node --input-type=module -e "import {Pipeline,rsi} from '@nemesis-oss/dhanhq-sdk/browser'; if (typeof Pipeline!=='function' || typeof rsi!=='function') throw new Error('browser ESM entry broken')"
          ./node_modules/.bin/dhanhq-mcp && exit 1 || echo "bin exits non-zero without credentials, as expected"
