name: Publish

on:
  release:
    types: [published]
  push:
    tags:
      - "v*"
  # Called by release-please.yml after it creates a release: a tag or release
  # created with GITHUB_TOKEN triggers neither of the events above.
  workflow_call:
  workflow_dispatch:
    inputs:
      tag:
        description: "npm dist-tag to publish under"
        required: false
        default: "latest"

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # Required for npm provenance, which package.json opts into.
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Run Typecheck and Test Suite
        run: |
          npm run typecheck
          npm test -- --runInBand

      - name: Build Package
        run: npm run build

      # `prepublishOnly` reruns clean + typecheck + test + build, ensuring a release
      # cannot ship a build that does not pass its own suite.
      - name: Publish to npm with Provenance
        run: npm publish --access public --tag ${{ inputs.tag || 'latest' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
