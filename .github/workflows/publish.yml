name: Publish

# Called by release-please.yml only. That file must be the trusted-publisher
# entry on npmjs.com, because trusted publishing validates the calling workflow.
# Publishes with npm trusted publishing (OIDC): no npm token is stored or used.
# The direct release, tag and dispatch triggers were removed; each would make
# this file the caller. Manual runs go through release-please.yml's
# workflow_dispatch.
on:
  workflow_call:
    inputs:
      tag:
        description: "npm dist-tag to publish under"
        required: false
        type: string
        default: "latest"

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # Required for npm trusted publishing (OIDC) and provenance.
      id-token: write

    steps:
      - uses: actions/checkout@v4

      # No registry-url: npm defaults to registry.npmjs.org, and setup-node's
      # .npmrc auth placeholder must not shadow the OIDC credential.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Pin npm for trusted publishing
        run: npm install -g npm@^11.21.0

      - run: npm ci --ignore-scripts

      - name: Run Typecheck, Lint and Test Suite
        # Mirrors the package's prepublishOnly gate, which this publish no longer
        # runs (--ignore-scripts keeps lifecycle hooks away from the OIDC token).
        run: |
          npm run typecheck
          npm run lint
          npm test -- --runInBand

      - name: Build Package
        run: npm run build

      - name: Publish to npm with Provenance
        env:
          NPM_DIST_TAG: ${{ inputs.tag || 'latest' }}
        run: npm publish --access public --tag "$NPM_DIST_TAG" --ignore-scripts
