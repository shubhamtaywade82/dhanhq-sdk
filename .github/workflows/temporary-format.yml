name: Temporary branch formatter

on:
  push:
    branches:
      - feat/nifty-option-premium-research

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/nifty-option-premium-research
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prettier --write src/analytics/optionPremiumAttribution.ts src/contracts/expired-options.schema.ts src/resources/ExpiredOptionsData.ts
      - name: Commit formatted files
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/analytics/optionPremiumAttribution.ts src/contracts/expired-options.schema.ts src/resources/ExpiredOptionsData.ts
            git commit -m "style: apply Prettier formatting to NIFTY research SDK changes"
            git push origin feat/nifty-option-premium-research
          fi
